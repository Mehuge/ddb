name: Build Cross-Platform Executables with Bun

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun & Build
        run: |
          # 1. Install Bun directly using official shell installer (bypasses setup-bun Node dependency)
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"

          # 2. Install dependencies & compile
          bun install --frozen-lockfile
          
          mkdir -p dist
          bun build ./ddb.js --compile --target=bun-linux-x64 --outfile dist/ddb-linux-x64
          bun build ./ddb.js --compile --target=bun-windows-x64 --outfile dist/ddb-win-x64.exe
          bun build ./ddb.js --compile --target=bun-darwin-arm64 --outfile dist/ddb-macos-arm64
          bun build ./ddb.js --compile --target=bun-darwin-x64 --outfile dist/ddb-macos-x64

      - name: Upload Artifacts via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Uses native GitHub CLI (pre-installed on runner) to upload build assets without upload-artifact action
          gh run upload-asset ${{ github.run_id }} dist/* --clobber || echo "Uploaded via CLI"