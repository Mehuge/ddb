name: Build Cross-Platform Executables with Bun

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc0570501b0f61d2d38622c2299d6387034b7f3 # v2.1.1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile Standalone Binaries
        run: |
          mkdir -p dist
          # Linux x64
          bun build ddb.js --compile --target=bun-linux-x64 --outfile dist/ddb-linux-x64
          
          # Windows x64
          bun build ddb.js --compile --target=bun-windows-x64 --outfile dist/ddb-win-x64.exe
          
          # macOS Apple Silicon (ARM64)
          bun build ddb.js --compile --target=bun-darwin-arm64 --outfile dist/ddb-macos-arm64
          
          # macOS Intel (x64)
          bun build ddb.js --compile --target=bun-darwin-x64 --outfile dist/ddb-macos-x64

      - name: Upload Artifacts
        uses: actions/upload-artifact@4aec534e0cbc6142effbc31d27522d4f2ccf152d # v4.6.0
        with:
          name: standalone-executables
          path: dist/*