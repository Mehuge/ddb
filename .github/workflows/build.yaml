name: Build Cross-Platform Executables with Bun

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile Standalone Binaries
        run: |
          mkdir -p dist
          # Linux x64
          bun build ddb.js --compile --target=bun-linux-x64 --outfile dist/ddb-linux-x64
          
          # Windows x64
          bun build ddb.js --compile --target=bun-windows-x64 --outfile dist/ddb-win-x64.exe
          
          # macOS Apple Silicon (ARM64)
          bun build ddb.js --compile --target=bun-darwin-arm64 --outfile dist/ddb-macos-arm64
          
          # macOS Intel (x64)
          bun build ddb.js --compile --target=bun-darwin-x64 --outfile dist/ddb-macos-x64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standalone-executables
          path: dist/*